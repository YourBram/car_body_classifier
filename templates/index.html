<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Body Classification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #2563eb
            );

            font-family: 'Segoe UI', sans-serif;
        }

        .glass-card{
            width:700px;

            background: rgba(255,255,255,0.1);

            backdrop-filter: blur(15px);

            border-radius:20px;

            padding:35px;

            color:white;

            box-shadow:0 8px 30px rgba(0,0,0,.3);
        }

        h1{
            font-weight:700;
            text-align:center;
            margin-bottom:25px;
        }

        .btn-custom{
            background:#38bdf8;
            border:none;
            font-weight:bold;
        }

        .btn-custom:hover{
            background:#0ea5e9;
        }

        .result-box{
            margin-top:25px;
            padding:20px;

            border-radius:15px;

            background:rgba(255,255,255,.15);

            text-align:center;
        }

        .prediction{
            font-size:32px;
            font-weight:bold;
            color:#facc15;
        }

        img{
            margin-top:15px;
            border-radius:15px;
            width:100%;
        }

    </style>

</head>

<body>

<div class="glass-card">

    <h1>🚗 Car Body Classifier</h1>

    <form action="/predict" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="image"
            class="form-control mb-3"
            required>

        <button
            class="btn btn-custom w-100"
            type="submit">

            Prediksi Mobil

        </button>

    </form>

    {% if prediction %}

    <div class="result-box">

        <h4>Hasil Prediksi</h4>

        <div class="prediction">
            {{ prediction }}
        </div>

        <img src="{{ url_for('static', filename=image) }}">

    </div>

    {% endif %}

</div>

</body>
</html>
